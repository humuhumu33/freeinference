[package]
name = "freeinference-holo"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "freeinference with the deterministic hologram-ai engine compiled in"
publish = false

# Its own package, not a workspace member, on purpose: hologram-ai pins a
# substrate revision that is private today, and a workspace lockfile would
# make the whole repository unbuildable without credentials. This package
# carries that pin alone.
[workspace]

[[bin]]
name = "freeinference"
path = "src/main.rs"

[dependencies]
freeinference = { path = ".." }
hologram-live = { git = "https://github.com/humuhumu33/hologram-live-upstream", branch = "module-seam" }
# Mirror of freeinference::modules::engine::HOLOGRAM_AI_REV; move together.
hologram-ai = { git = "https://github.com/humuhumu33/hologram-ai", rev = "50ebbfe3dd9b558cf238f3f52784233e7fe1c254" }
hologram-ai-tokenizer = { git = "https://github.com/humuhumu33/hologram-ai", rev = "50ebbfe3dd9b558cf238f3f52784233e7fe1c254" }
hologram-ai-safetensors = { git = "https://github.com/humuhumu33/hologram-ai", rev = "50ebbfe3dd9b558cf238f3f52784233e7fe1c254" }
hologram-ai-common = { git = "https://github.com/humuhumu33/hologram-ai", rev = "50ebbfe3dd9b558cf238f3f52784233e7fe1c254" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tonic = { version = "0.14", default-features = false }
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"
