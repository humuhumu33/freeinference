name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/model_write.py --check
      - run: python scripts/check_site.py site/index.html

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo fmt --all -- --check
      # Public build: the root package, which carries no private pin. The
      # deterministic engine is the separate engine/ package below.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --test-threads=1

  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: token
        env:
          TOKEN: ${{ secrets.HOLOGRAM_GIT_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::HOLOGRAM_GIT_TOKEN is not set; the engine build is verified locally only (VERIFICATION.md)"; fi
      - if: steps.token.outputs.ok == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: steps.token.outputs.ok == 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - if: steps.token.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.HOLOGRAM_GIT_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - if: steps.token.outputs.ok == 'true'
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets --locked -- -D warnings
      - if: steps.token.outputs.ok == 'true'
        run: cargo build --manifest-path engine/Cargo.toml --locked
